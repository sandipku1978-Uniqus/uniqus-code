[Service]
# The network boot unit reads the same file, making FIRECRACKER_CIDR one
# canonical host setting instead of two independently drifting overrides.
EnvironmentFile=-/etc/default/uniqus-firecracker
# Tenant project disks and snapshots are created by the orchestrator. Keep new
# files private even before the service is migrated from root to a dedicated uid.
UMask=0077
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=full
ProtectHome=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
