name: Security and release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject high-severity production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Reject high-severity advisories in the full toolchain
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test orchestrator
        run: npm --workspace=@gate15/orchestrator test
      - name: Build web
        run: npm --workspace=@gate15/web run build
      - name: Test locked Rust sandbox agent
        run: cargo test --locked --manifest-path services/sandbox-agent/Cargo.toml
